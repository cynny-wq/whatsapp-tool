<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Linker - Premium Plan</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f0f2f5; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #25D366; text-align: center; margin-top: 0; }
        .badge { background: #25D366; color: white; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; float: right; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; }
        textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #25D366; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .link-list { margin-top: 20px; }
        .link-item { background: #e7fed9; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        a { background: #25D366; color: white; padding: 5px 10px; text-decoration: none; border-radius: 3px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <span class="badge">PRO UNLIMITED</span>
    <h2>WhatsApp Mobile Linker</h2>

    <label>1. Type Message Template (Use {name}):</label>
    <textarea id="message">Hello {name}, thank you for your order!</textarea>

    <label>2. Paste Customers (Format: Name, Phone):</label>
    <textarea id="customers" rows="6" placeholder="John, 254712345678&#10;Mary, 254787654321&#10;Alice, 254711112222"></textarea>

    <button onclick="processData()">Generate WhatsApp Links</button>

    <div class="link-list" id="output"></div>
</div>

<script>
function processData() {
    const template = document.getElementById('message').value;
    const rawData = document.getElementById('customers').value.trim();
    const outputDiv = document.getElementById('output');
    
    outputDiv.innerHTML = ''; 

    if (!rawData) {
        alert('Please paste customer data first.');
        return;
    }

    // NO LIMIT: Processes every single line pasted by the user
    let lines = rawData.split('\n').filter(line => line.trim() !== '');
    
    lines.forEach(line => {
        const parts = line.split(',');
        if (parts.length >= 2) {
            const name = parts[0].trim();
            const phone = parts[1].trim().replace(/\s+/g, '').replace('+', '');
            
            const customMessage = template.replace('{name}', name);
            const encodedMessage = encodeURIComponent(customMessage);
            const whatsappUrl = `https://wa.me{phone}?text=${encodedMessage}`;

            const item = document.createElement('div');
            item.className = 'link-item';
            item.innerHTML = `<span><strong>${name}</strong> (${phone})</span> <a href="${whatsappUrl}" target="_blank">Chat</a>`;
            outputDiv.appendChild(item);
        }
    });
}
</script>

</body>
</html>
